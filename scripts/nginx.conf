worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Suppress Nginx version from error responses
    server_tokens off;

    server {
        listen 80;
        server_name localhost;

        root  C:/mms/frontend;
        index index.html;

        # -------------------------------------------------------
        # Backend API reverse proxy
        # All /api/* requests are forwarded to the Express server
        # -------------------------------------------------------
        location /api/ {
            proxy_pass         http://localhost:3001/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # -------------------------------------------------------
        # Reporting service reverse proxy
        # -------------------------------------------------------
        location /reports/ {
            proxy_pass         http://localhost:8085/reports/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # -------------------------------------------------------
        # React SPA catch-all
        # Must come AFTER the /api/ and /reports/ blocks
        # -------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # -------------------------------------------------------
        # Cache static assets produced by Vite
        # Vite content-hashes filenames, so max-age is safe
        # -------------------------------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        error_log  C:/nginx/logs/error.log  warn;
        access_log C:/nginx/logs/access.log;
    }
}
